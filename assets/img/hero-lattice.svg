<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAF8F3"/>
      <stop offset="55%" stop-color="#F3F0E8"/>
      <stop offset="100%" stop-color="#EFEDE7"/>
    </linearGradient>
    <linearGradient id="facetBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#23417A" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#23417A" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="facetTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E7A78" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#1E7A78" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="facetEmerald" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#1C7A56" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#1C7A56" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="facetGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B8963E" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#B8963E" stop-opacity="0.00"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#base)"/>

  <!-- large abstract crystal facets -->
  <polygon points="1120,0 1600,0 1600,420 1360,520 1180,300" fill="url(#facetBlue)"/>
  <polygon points="1360,520 1600,420 1600,780 1420,760" fill="url(#facetTeal)"/>
  <polygon points="0,760 260,640 480,820 260,1000 0,1000" fill="url(#facetEmerald)"/>
  <polygon points="900,860 1180,760 1340,920 1120,1000 900,1000" fill="url(#facetGold)"/>

  <!-- crystal lattice linework -->
  <g fill="none" stroke="#23417A" stroke-width="1" opacity="0.14">
    <path d="M1120,0 L1360,520 L1180,300 Z"/>
    <path d="M1360,520 L1600,420 L1420,760 Z"/>
    <path d="M1180,300 L1360,520 L1420,760"/>
    <path d="M1180,300 L1120,0"/>
  </g>
  <g fill="none" stroke="#1E7A78" stroke-width="1" opacity="0.13">
    <path d="M0,760 L260,640 L480,820 L260,1000"/>
    <path d="M260,640 L480,820"/>
  </g>
  <g fill="none" stroke="#B8963E" stroke-width="1" opacity="0.16">
    <path d="M900,860 L1180,760 L1340,920 L1120,1000"/>
    <path d="M1180,760 L1120,1000"/>
  </g>

  <!-- fine mineral veins across the whole field -->
  <g fill="none" stroke="#8A96A6" stroke-width="0.8" opacity="0.16">
    <path d="M-40,180 C 220,140 360,260 620,190 S 1040,120 1300,210"/>
    <path d="M-40,420 C 260,470 480,360 760,430 S 1180,500 1650,410"/>
    <path d="M-40,600 C 300,560 520,660 820,590 S 1240,540 1650,610"/>
  </g>

  <!-- thin gold accent veins, sparse -->
  <g fill="none" stroke="#B8963E" stroke-width="1" opacity="0.22">
    <path d="M300,0 C 340,140 260,260 340,420"/>
    <path d="M1500,120 C 1460,260 1540,340 1480,520"/>
  </g>
</svg>

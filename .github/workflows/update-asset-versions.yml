name: Bake pages and stamp assets

# On every push to main, mirrors the resume sections into the publications
# pages, bakes the SEO block into every page's <head> and rebuilds
# sitemap.xml (scripts/build_seo.py), and rewrites each HTML page's ?v=...
# query string to that commit's short SHA and republishes version.json.
#
# It used to run only when style.css or app.js/lab.js changed, which left
# a hole big enough to walk through: a commit that edits only HTML changed
# the page but not the stamp. The stamp has to move whenever anything
# published moves, so the trigger is now every push.
# The bump commit below carries [skip ci], which is what keeps this from
# triggering itself.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Both write-back workflows commit to main. They must never run their
# checkout/build/push windows at the same time: the resume artifacts are
# binary files and cannot be rebased/merged safely after a concurrent push.
concurrency:
  group: main-writeback
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # build_seo.py reads each page's last real commit date for the
          # sitemap's <lastmod>; a shallow clone has no history to read.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Mirror resume sections into the publications pages
        run: python3 scripts/build_publications.py

      - name: Bake the SEO block into every page and rebuild sitemap.xml
        run: python3 scripts/build_seo.py

      - name: Update asset versions in HTML
        run: python3 scripts/update_asset_versions.py

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html resume/index.html publications/index.html contact/index.html \
                  fa/index.html fa/resume/index.html fa/publications/index.html fa/contact/index.html \
                  version.json sitemap.xml
          git diff --staged --quiet && exit 0
          git commit -m "chore: bump asset cache-busting versions [skip ci]"
          git push

      - name: Ping IndexNow with every page
        run: python3 scripts/indexnow.py

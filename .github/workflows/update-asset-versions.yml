name: Update asset cache-busting versions

# Whenever style.css or app.js/lab.js actually change, rewrites every
# HTML page's ?v=... query string to that commit's short SHA. Without
# this, a browser that already cached the old style.css/app.js has no
# reason to notice a deploy happened and can keep serving the stale
# file for hours (see scripts/update_asset_versions.py for the rest of
# the story) — this used to be a date typed by hand into each page.

on:
  push:
    branches: [main]
    paths:
      - "assets/css/style.css"
      - "assets/js/app.js"
      - "assets/js/lab.js"
      - "scripts/update_asset_versions.py"
      - ".github/workflows/update-asset-versions.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update asset versions in HTML
        run: python3 scripts/update_asset_versions.py

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html resume/index.html publications/index.html contact/index.html \
                  fa/index.html fa/resume/index.html fa/publications/index.html fa/contact/index.html
          git diff --staged --quiet && exit 0
          git commit -m "chore: bump asset cache-busting versions [skip ci]"
          # Another workflow (e.g. build-resume-docs) can push to main
          # between our checkout and this push -- retry with a rebase
          # instead of failing outright on a non-fast-forward rejection.
          for i in 1 2 3 4 5; do
            git push && exit 0
            git fetch origin main
            git rebase origin/main
            sleep $((RANDOM % 5 + 1))
          done
          git push

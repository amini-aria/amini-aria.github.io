name: Build resume documents

# Regenerates assets/files/Aria-CV-En.docx/.pdf and Aria-CV-Fa.docx/.pdf
# from scripts/resume_data.py using scripts/build_resume_docs.py. The PDF
# is produced by converting the just-built .docx with LibreOffice headless,
# so the two files are always identical in content — editing
# scripts/resume_data.py and pushing is all that's needed to update both.
#
# The .docx files are intentionally never linked from the site UI (only
# the .pdf download buttons are), but they live at the same path with a
# .docx extension, so they're reachable by anyone who edits the URL.

on:
  push:
    branches: [main]
    paths:
      - "scripts/resume_data.py"
      - "scripts/build_resume_docs.py"
      - "scripts/jalali.py"
      - "assets/fonts/**"
      - ".github/workflows/build-resume-docs.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-resume-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install LibreOffice, python-docx, and the UNO scripting bridge
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice python3-uno
          pip install python-docx

      - name: Install real Times New Roman (used by the English resume)
        run: |
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
          sudo apt-get install -y ttf-mscorefonts-installer
          fc-cache -f

      - name: Install Dana fonts (used by the Persian resume)
        run: |
          mkdir -p ~/.fonts
          cp assets/fonts/Dana-*.ttf ~/.fonts/
          fc-cache -f ~/.fonts

      - name: Archive the previous resume documents as a backup
        run: |
          mkdir -p backup/resume-docs
          ts=$(date -u +%Y%m%d-%H%M%S)
          for f in assets/files/Aria-CV-En.docx assets/files/Aria-CV-En.pdf \
                   assets/files/Aria-CV-Fa.docx assets/files/Aria-CV-Fa.pdf; do
            if [ -f "$f" ]; then
              base=$(basename "$f")
              cp "$f" "backup/resume-docs/${base%.*}-${ts}.${base##*.}"
            fi
          done

      - name: Build resume documents
        run: python3 scripts/build_resume_docs.py

      - name: Embed fonts into the .docx files
        # Must run under the system python3 (not the actions/setup-python
        # one) — that's where apt's python3-uno installed the `uno` bindings.
        run: /usr/bin/python3 scripts/embed_docx_fonts.py assets/files/Aria-CV-En.docx assets/files/Aria-CV-Fa.docx

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/files/Aria-CV-En.docx assets/files/Aria-CV-En.pdf \
                  assets/files/Aria-CV-Fa.docx assets/files/Aria-CV-Fa.pdf \
                  backup/resume-docs
          git diff --staged --quiet || git commit -m "chore: regenerate resume documents [skip ci]"
          git push
